<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>历史任务 - SEO &amp; GEO</title>
    <script src="js/tailwindcss.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/main.css">
</head>

<body class="pro-ui audit-theme history-page min-h-screen">
    <!-- Header -->
    <header class="glass-panel sticky top-0 z-50">
        <div class="max-w-5xl mx-auto px-4 sm:px-6 py-3 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <button onclick="window.location.href='app.html'"
                    class="text-[13px] text-[var(--text-muted)] hover:text-[var(--brand)] transition-colors flex items-center gap-1.5">
                    <i class="fas fa-arrow-left text-[11px]"></i>
                    <span>返回</span>
                </button>
                <div class="w-7 h-7 flex items-center justify-center rounded-lg bg-[var(--brand-dim)]">
                    <i class="fas fa-clock text-[var(--brand)] text-[11px]"></i>
                </div>
                <span class="text-[14px] font-semibold text-[var(--text-primary)]">历史任务</span>
            </div>

            <div class="flex items-center gap-3">
                <button id="refreshHistoryBtn"
                    class="text-[13px] text-[var(--text-muted)] hover:text-[var(--brand)] transition-colors flex items-center gap-1.5">
                    <i class="fas fa-sync-alt text-[11px]"></i>
                    <span>刷新</span>
                </button>
                <button id="adminPanelBtn" onclick="window.location.href='admin.html'"
                    class="hidden text-[13px] text-[var(--accent-secondary)] hover:text-[var(--text-primary)] transition-colors flex items-center gap-1.5">
                    <i class="fas fa-shield-alt text-[11px]"></i>
                    <span>管理</span>
                </button>
                <div class="flex items-center gap-2 text-[13px] text-[var(--text-muted)] px-2.5 py-1 border border-[var(--border-subtle)] rounded-lg bg-[var(--surface-soft)]">
                    <i class="fas fa-user text-[var(--brand)] text-[11px]"></i>
                    <span id="currentUsername" class="font-mono text-[12px]">-</span>
                </div>
                <button onclick="logout()" class="text-[13px] text-[var(--text-muted)] hover:text-[var(--critical)] transition-colors flex items-center gap-1.5">
                    <i class="fas fa-sign-out-alt text-[11px]"></i>
                    <span>退出</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main -->
    <main class="max-w-5xl mx-auto px-4 sm:px-6 py-8 relative z-10">
        <div class="text-center mb-8 fade-in">
            <h1 class="text-xl font-semibold text-[var(--text-primary)] mb-1.5">历史任务</h1>
            <p class="text-[13px] text-[var(--text-muted)]">查看和管理您的 SEO &amp; GEO 报告</p>
        </div>

        <!-- Loading -->
        <div id="loadingIndicator" class="py-16 text-center hidden fade-in">
            <div class="loading-spinner mx-auto mb-3"></div>
            <span class="text-[var(--text-muted)] text-sm font-mono">加载中...</span>
        </div>

        <!-- History List -->
        <div id="historyContainer" class="space-y-3 fade-in" style="animation-delay: 0.15s">
            <div class="text-center py-12 text-[var(--text-muted)]">
                <i class="fas fa-inbox text-3xl mb-3 opacity-30"></i>
                <p class="text-sm">暂无 历史任务</p>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="border-t border-[var(--border-subtle)] py-8 mt-auto">
        <div class="max-w-5xl mx-auto px-4 text-center">
            <p class="text-[11px] text-[var(--text-faint)] tracking-wider">
                <span class="font-semibold text-[var(--brand)]">SEO &amp; GEO</span
            </p>
        </div>
    </footer>

    <script src="js/utils.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/history.js"></script>
    <script>
        (async () => {
            const user = await checkAuth();
            if (user) {
                document.getElementById('currentUsername').textContent = user.username;
                if (user.role === 'admin') {
                    document.getElementById('adminPanelBtn').classList.remove('hidden');
                }
            }
        })();
    </script>
</body>

</html>
