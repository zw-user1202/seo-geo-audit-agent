<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#ffffff">

<title>联系作者 - SEO & GEO</title>
<style>
@font-face{font-family:HarmonyOS Sans SC;font-style:normal;font-weight:400;font-display:swap;src:local("HarmonyOS Sans SC")}
:root{font-family:HarmonyOS Sans SC,PingFang SC,Microsoft YaHei,Arial,sans-serif;color:#1a1a1a;background:#fff;font-synthesis:weight;text-rendering:optimizeLegibility;letter-spacing:0;--bg:#ffffff;--ink:#1a1a1a;--muted:#74746f;--faint:#a0a09b;--line:rgba(26,26,26,.12)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-width:320px;min-height:100vh;background:var(--bg)}h1,h2,h3,p{margin:0}
.site-header{position:sticky;z-index:50;top:0;display:flex;width:min(1200px,calc(100% - 48px));min-height:76px;align-items:center;justify-content:space-between;margin:0 auto;background:#fffffff0;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.wordmark,.site-nav a{padding:0;border:0;color:var(--ink);background:transparent;cursor:pointer;text-decoration:none}
.wordmark{display:inline-flex;align-items:center;gap:14px}
.wordmark-name{font-size:34px;font-weight:650;line-height:1}
.site-nav{display:flex;align-items:center;gap:28px}
.site-nav a{position:relative;font-size:14px;font-weight:500}
.site-nav a:after{position:absolute;right:0;bottom:-6px;left:0;height:1px;content:"";background:var(--ink);transform:scaleX(0);transform-origin:left;transition:transform .18s ease}
.site-nav a:hover:after{transform:scaleX(1)}
.contact-page{width:min(1200px,calc(100% - 48px));margin:0 auto;padding:72px 0 80px}
.contact-intro{margin-bottom:56px}
.contact-eyebrow{color:var(--muted);font-family:monospace;font-size:10px;font-weight:500;line-height:1.5;text-transform:uppercase;margin-bottom:18px}
.contact-intro h1{font-size:clamp(38px,8vw,68px);font-weight:520;line-height:1.08}
.contact-intro>p{max-width:590px;margin-top:24px;color:#4d4d49;font-size:16px;line-height:1.8}
.contact-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.contact-card{padding:48px 40px;border-right:1px solid var(--line)}
.contact-card:last-child{border-right:none}
.contact-card-label{color:var(--muted);font-family:monospace;font-size:10px;font-weight:500;text-transform:uppercase;margin-bottom:20px}
.contact-qr{width:min(240px,100%);aspect-ratio:1;border-radius:8px;object-fit:contain;background:#fafafa;border:1px solid var(--line)}
.contact-phone{font-size:32px;font-weight:520;letter-spacing:2px;line-height:1.4}
.contact-phone-copy{display:inline-flex;align-items:center;gap:6px;margin-top:16px;padding:8px 16px;border:1px solid var(--line);border-radius:6px;color:var(--ink);font-size:13px;font-weight:500;cursor:pointer;background:transparent;transition:all .15s}
.contact-phone-copy:hover{background:var(--ink);color:#fff;border-color:var(--ink)}
.site-footer{min-height:280px;background:#fff}
.footer-inner{position:relative;display:flex;width:min(1200px,calc(100% - 48px));min-height:280px;align-items:flex-start;margin:0 auto;padding:76px 0 48px}
.social-links{display:flex;gap:10px}
.social-links a{display:inline-grid;width:44px;height:44px;padding:0;place-items:center;border:1px solid var(--line);border-radius:6px;color:var(--ink);background:#fff;cursor:pointer;text-decoration:none;transition:color .16s ease,background .16s ease}
.social-links a:hover{color:#fff;background:var(--ink)}
.footer-rule{position:absolute;right:0;bottom:48px;left:0;height:1px;background:var(--line)}
.footer-copy{position:absolute;right:0;bottom:20px;color:var(--faint);font-family:monospace;font-size:9px}
.toast{position:fixed;bottom:40px;left:50%;transform:translateX(-50%);padding:12px 24px;background:var(--ink);color:#fff;border-radius:8px;font-size:13px;font-weight:500;opacity:0;transition:opacity .3s;pointer-events:none;z-index:999}
.toast.show{opacity:1}
@media(max-width:720px){.contact-grid{grid-template-columns:1fr}.contact-card{border-right:none;border-bottom:1px solid var(--line)}.contact-card:last-child{border-bottom:none}.contact-intro h1{font-size:48px}}
</style>
<link rel="icon" href="/favicon.jpg" type="image/jpeg">
</head>
<body>

</div>
<div class="footer-rule"></div>

</div>

</body>
</html>
