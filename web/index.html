<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#ffffff">
    <meta name="robots" content="index, follow">
    <meta name="description" content="SEO & GEO — 一站式 SEO 审计与 GEO 采集分析平台，输入网页地址即可获取优化建议。">
    <meta property="og:type" content="website">
    <meta property="og:locale" content="zh_CN">
    <meta property="og:site_name" content="SEO & GEO">
    <meta property="og:title" content="SEO & GEO｜智能网站审计平台">
    <meta property="og:description" content="一站式 SEO 审计与 GEO 采集分析平台">
    <title>SEO & GEO｜智能网站审计平台</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --ink: #1a1a1a;
            --bg: #ffffff;
            --muted: #74746f;
            --faint: #a0a09b;
            --line: rgba(26, 26, 26, .12);
            --line-strong: rgba(26, 26, 26, .28);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { scroll-behavior: smooth; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
            color: var(--ink);
            background: var(--bg);
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
        }
        a { color: inherit; text-decoration: none; }

        /* Header */
        .site-header {
            position: sticky;
            z-index: 50;
            top: 0;
            display: flex;
            width: min(1200px, calc(100% - 48px));
            min-height: 76px;
            align-items: center;
            justify-content: space-between;
            margin: 0 auto;
            background: rgba(255,255,255,.92);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
        }
        .wordmark {
            display: inline-flex;
            align-items: center;
            gap: 14px;
        }
        .wordmark-name {
            font-size: 28px;
            font-weight: 650;
            line-height: 1;
            letter-spacing: -0.5px;
        }
        .wordmark-tag {
            color: var(--muted);
            font-family: 'Space Mono', monospace;
            font-size: 10px;
            font-weight: 500;
            line-height: 1.35;
            text-transform: uppercase;
        }
        .site-nav {
            display: flex;
            align-items: center;
            gap: 28px;
        }
        .site-nav a {
            position: relative;
            font-size: 14px;
            font-weight: 500;
        }
        .site-nav a:after {
            position: absolute;
            right: 0;
            bottom: -6px;
            left: 0;
            height: 1px;
            content: "";
            background: var(--ink);
            transform: scaleX(0);
            transform-origin: left;
            transition: transform .18s ease;
        }
        .site-nav a:hover:after,
        .site-nav a[aria-current="page"]:after {
            transform: scaleX(1);
        }

        /* Landing */
        .landing-page {
            width: min(1200px, calc(100% - 48px));
            margin: 0 auto;
        }
        .landing-intro {
            display: grid;
            min-height: calc(100vh - 76px);
            grid-template-columns: minmax(220px, .72fr) minmax(0, 1.28fr);
            align-items: center;
            gap: 64px;
            padding: 58px 0 90px;
        }
        .landing-entry {
            display: flex;
            align-items: flex-start;
            flex-direction: column;
            gap: 30px;
        }
        .eyebrow {
            color: var(--muted);
            font-family: 'Space Mono', monospace;
            font-size: 10px;
            font-weight: 500;
            line-height: 1.5;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .start-button {
            display: inline-flex;
            min-width: 142px;
            min-height: 52px;
            align-items: center;
            justify-content: space-between;
            gap: 28px;
            padding: 0 18px 0 22px;
            border: 1px solid var(--ink);
            border-radius: 999px;
            color: #fff;
            background: var(--ink);
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: color .18s ease, background .18s ease;
        }
        .start-button:hover {
            color: var(--ink);
            background: transparent;
        }
        .start-button svg {
            width: 18px;
            height: 18px;
        }
        .landing-copy {
            max-width: 760px;
            justify-self: end;
        }
        .landing-copy h1 {
            max-width: 720px;
            font-size: 62px;
            font-weight: 520;
            line-height: 1.08;
            letter-spacing: -1px;
        }
        .landing-copy h1 span {
            display: block;
        }
        .landing-copy > p {
            max-width: 590px;
            margin-top: 32px;
            color: #4d4d49;
            font-size: 16px;
            font-weight: 400;
            line-height: 1.8;
        }
        .landing-copy > p span + span {
            margin-top: 2px;
            display: block;
        }

        /* Visual */
        .landing-visual {
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .visual-card {
            width: 100%;
            max-width: 520px;
            border: 1px solid var(--line);
            border-radius: 12px;
            overflow: hidden;
            background: var(--bg);
        }
        .visual-card-header {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 16px 20px;
            border-bottom: 1px solid var(--line);
        }
        .visual-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--line-strong);
        }
        .visual-card-body {
            padding: 24px 20px;
        }
        .visual-mock-line {
            height: 10px;
            border-radius: 5px;
            background: var(--line);
            margin-bottom: 12px;
        }
        .visual-mock-line:nth-child(1) { width: 85%; }
        .visual-mock-line:nth-child(2) { width: 65%; }
        .visual-mock-line:nth-child(3) { width: 75%; }
        .visual-mock-line:nth-child(4) { width: 45%; }
        .visual-mock-block {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 20px;
        }
        .visual-mock-item {
            height: 80px;
            border: 1px solid var(--line);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Space Mono', monospace;
            font-size: 11px;
            color: var(--faint);
        }

        /* Mobile */
        @media (max-width: 768px) {
            .site-header { min-height: 60px; }
            .wordmark-name { font-size: 22px; }
            .site-nav { gap: 16px; }
            .site-nav a { font-size: 12px; }
            .landing-intro {
                grid-template-columns: 1fr;
                min-height: auto;
                padding: 40px 0 60px;
                gap: 40px;
            }
            .landing-copy { justify-self: start; }
            .landing-copy h1 { font-size: 36px; }
            .landing-visual { order: -1; }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="site-header">
        <a href="/" class="wordmark">
            <span class="wordmark-name">SEO & GEO</span>
            
        </a>
        <nav class="site-nav">
            <a href="/login.html">登录</a>
            <a href="/register.html">注册</a>
        </nav>
    </header>

    <!-- Main -->
    <main class="landing-page">
        <section class="landing-intro">
            <div class="landing-entry">
                                <a href="/register.html" class="start-button">
                    开始使用
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M5 12h14M12 5l7 7-7 7"/>
                    </svg>
                </a>
            </div>
            <div class="landing-copy">
                <h1>
                    <span>输入网址，获取</span>
                    <span>SEO 与 GEO 优化建议</span>
                </h1>
                <p>
                    输入网页地址，一键获取 SEO 审计与 GEO 采集分析报告。
                </p>
            </div>
        </section>
    </main>

    <script src="js/utils.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>

<script>
// 已登录用户自动跳转到控制台
(async () => {
    try {
        const resp = await fetch('/api/check-session', { credentials: 'include' });
        if (resp.ok) {
            // 已登录，更新导航链接
            const loginLink = document.querySelector('a[href="/login.html"]');
            if (loginLink) {
                loginLink.href = '/app.html';
                loginLink.textContent = '控制台';
            }
            // 如果有"进入控制台"按钮也更新
            document.querySelectorAll('a[href="/login.html"]').forEach(a => {
                a.href = '/app.html';
                if (a.textContent.includes('登录') || a.textContent.includes('免费')) {
                    a.textContent = '进入控制台';
                }
            });
        }
    } catch (e) {}
})();
</script>
</body>
</html>
