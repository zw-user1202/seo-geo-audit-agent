<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 - SEO & GEO</title>
    <style>
        :root {
            --ink: #1a1a1a;
            --bg: #ffffff;
            --muted: #74746f;
            --faint: #a0a09b;
            --line: rgba(26, 26, 26, .12);
            --line-strong: rgba(26, 26, 26, .28);
            --danger: #c53030;
            --success: #2f855a;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { scroll-behavior: smooth; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
            color: var(--ink);
            background: var(--bg);
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        a { color: inherit; text-decoration: none; }

        /* Header */
        .site-header {
            position: sticky;
            z-index: 50;
            top: 0;
            display: flex;
            width: min(1200px, calc(100% - 48px));
            min-height: 76px;
            align-items: center;
            justify-content: space-between;
            margin: 0 auto;
            background: rgba(255,255,255,.92);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
        }
        .wordmark {
            display: inline-flex;
            align-items: center;
            gap: 14px;
        }
        .wordmark-name {
            font-size: 28px;
            font-weight: 650;
            line-height: 1;
            letter-spacing: -0.5px;
        }
        .wordmark-tag {
            color: var(--muted);
            font-family: 'Space Mono', monospace;
            font-size: 10px;
            font-weight: 500;
            line-height: 1.35;
            text-transform: uppercase;
        }
        .site-nav {
            display: flex;
            align-items: center;
            gap: 28px;
        }
        .site-nav a {
            position: relative;
            font-size: 14px;
            font-weight: 500;
        }
        .site-nav a:after {
            position: absolute;
            right: 0;
            bottom: -6px;
            left: 0;
            height: 1px;
            content: "";
            background: var(--ink);
            transform: scaleX(0);
            transform-origin: left;
            transition: transform .18s ease;
        }
        .site-nav a:hover:after { transform: scaleX(1); }

        /* Auth Container */
        .auth-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 24px;
        }
        .auth-card {
            width: 100%;
            max-width: 420px;
        }
        .auth-title {
            font-size: 32px;
            font-weight: 650;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
        }
        .auth-subtitle {
            color: var(--muted);
            font-size: 15px;
            margin-bottom: 40px;
            line-height: 1.6;
        }

        /* Form */
        .form-group {
            margin-bottom: 24px;
        }
        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--ink);
            margin-bottom: 8px;
        }
        .form-input {
            width: 100%;
            height: 48px;
            padding: 0 16px;
            border: 1px solid var(--line);
            border-radius: 8px;
            font-size: 15px;
            color: var(--ink);
            background: var(--bg);
            transition: border-color .18s ease;
            outline: none;
            font-family: inherit;
        }
        .form-input:focus {
            border-color: var(--ink);
        }
        .form-input::placeholder {
            color: var(--faint);
        }
        .password-wrapper {
            position: relative;
        }
        .password-toggle {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--faint);
            cursor: pointer;
            font-size: 14px;
            padding: 4px;
            transition: color .18s ease;
        }
        .password-toggle:hover {
            color: var(--ink);
        }

        /* Button */
        .btn-primary {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 52px;
            border: 1px solid var(--ink);
            border-radius: 999px;
            color: #fff;
            background: var(--ink);
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: color .18s ease, background .18s ease;
            gap: 10px;
            font-family: inherit;
        }
        .btn-primary:hover {
            color: var(--ink);
            background: transparent;
        }
        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Messages */
        .msg {
            display: none;
            padding: 14px 16px;
            font-size: 14px;
            border-radius: 8px;
            margin-bottom: 20px;
            line-height: 1.5;
        }
        .msg.show { display: block; }
        .msg-error {
            border: 1px solid var(--danger);
            background: rgba(197, 48, 48, 0.06);
            color: var(--danger);
        }
        .msg-success {
            border: 1px solid var(--success);
            background: rgba(47, 133, 90, 0.06);
            color: var(--success);
        }

        /* Links */
        .auth-link {
            text-align: center;
            margin-top: 28px;
            font-size: 14px;
            color: var(--muted);
        }
        .auth-link a {
            font-weight: 600;
            color: var(--ink);
        }
        .auth-link a:hover {
            text-decoration: underline;
        }

        /* Footer */
        .auth-footer {
            text-align: center;
            padding: 32px 24px;
        }
        .auth-footer p {
            font-family: 'Space Mono', monospace;
            font-size: 11px;
            color: var(--faint);
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .auth-footer span {
            font-weight: 700;
            color: var(--ink);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .auth-title { font-size: 26px; }
            .auth-container { padding: 24px 20px; }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="site-header">
        <a href="/" class="wordmark">
            <div>
                <div class="wordmark-name">SEO & GEO</div>
            </div>
        </a>
        <nav class="site-nav">
            <a href="/">首页</a>
            <a href="/login.html">登录</a>
        </nav>
    </header>

    <!-- Register Form -->
    <main class="auth-container">
        <div class="auth-card">
            <h1 class="auth-title">注册账号</h1>
            <p class="auth-subtitle">创建账号即可免费体验 SEO/GEO 评分功能。</p>

            <div id="errorMsg" class="msg msg-error"></div>
            <div id="successMsg" class="msg msg-success"></div>

            <form id="registerForm">
                <div class="form-group">
                    <label for="username">用户名</label>
                    <input type="text" id="username" name="username" required autocomplete="username" class="form-input" placeholder="输入用户名 (至少3个字符)">
                </div>
                <div class="form-group">
                    <label for="email">邮箱 (可选)</label>
                    <input type="email" id="email" name="email" autocomplete="email" class="form-input" placeholder="输入邮箱地址">
                </div>
                <div class="form-group">
                    <label for="password">密码</label>
                    <div class="password-wrapper">
                        <input type="password" id="password" name="password" required autocomplete="new-password" class="form-input" placeholder="输入密码 (至少8个字符)">
                        <button type="button" onclick="togglePassword()" class="password-toggle">
                            <i class="fas fa-eye" id="passwordToggleIcon"></i>
                        </button>
                    </div>
                </div>
                <div class="form-group">
                    <label for="confirmPassword">确认密码</label>
                    <div class="password-wrapper">
                        <input type="password" id="confirmPassword" name="confirmPassword" required autocomplete="new-password" class="form-input" placeholder="再次输入密码">
                    </div>
                </div>
                <button type="submit" id="submitBtn" class="btn-primary">
                    <i class="fas fa-user-plus"></i>
                    <span>注册</span>
                </button>
            </form>

            <div class="auth-link">
                已有账号？ <a href="login.html">立即登录</a>
            </div>
        </div>
    </main>

    <!-- Footer -->

    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.js"></script>
    <script>
        function togglePassword() {
            const pwd = document.getElementById('password');
            const icon = document.getElementById('passwordToggleIcon');
            if (pwd.type === 'password') {
                pwd.type = 'text';
                icon.classList.replace('fa-eye', 'fa-eye-slash');
            } else {
                pwd.type = 'password';
                icon.classList.replace('fa-eye-slash', 'fa-eye');
            }
        }

        const form = document.getElementById('registerForm');
        const submitBtn = document.getElementById('submitBtn');
        const errorMsg = document.getElementById('errorMsg');
        const successMsg = document.getElementById('successMsg');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            errorMsg.classList.remove('show');
            successMsg.classList.remove('show');

            if (username.length < 3) {
                errorMsg.textContent = '用户名至少需要3个字符';
                errorMsg.classList.add('show');
                return;
            }
            if (password.length < 8) {
                errorMsg.textContent = '密码至少需要8个字符';
                errorMsg.classList.add('show');
                return;
            }
            if (password !== confirmPassword) {
                errorMsg.textContent = '两次输入的密码不一致';
                errorMsg.classList.add('show');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> <span>注册中...</span>';

            try {
                const res = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, email, password })
                });
                const data = await res.json();
                if (res.ok) {
                    successMsg.textContent = '注册成功！正在跳转到登录页面...';
                    successMsg.classList.add('show');
                    setTimeout(() => { window.location.href = 'login.html'; }, 1500);
                } else {
                    errorMsg.textContent = data.error || '注册失败';
                    errorMsg.classList.add('show');
                }
            } catch (err) {
                errorMsg.textContent = '网络错误，请重试';
                errorMsg.classList.add('show');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fas fa-user-plus"></i> <span>注册</span>';
            }
        });

        document.getElementById('username').focus();
    </script>
</body>
</html>
