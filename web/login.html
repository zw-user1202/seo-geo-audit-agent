<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - SEO & GEO</title>
    <style>
        :root {
            --ink: #1a1a1a;
            --bg: #ffffff;
            --muted: #74746f;
            --faint: #a0a09b;
            --line: rgba(26, 26, 26, .12);
            --line-strong: rgba(26, 26, 26, .28);
            --danger: #c53030;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { scroll-behavior: smooth; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
            color: var(--ink);
            background: var(--bg);
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        a { color: inherit; text-decoration: none; }

        /* Header */
        .site-header {
            position: sticky;
            z-index: 50;
            top: 0;
            display: flex;
            width: min(1200px, calc(100% - 48px));
            min-height: 76px;
            align-items: center;
            justify-content: space-between;
            margin: 0 auto;
            background: rgba(255,255,255,.92);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
        }
        .wordmark {
            display: inline-flex;
            align-items: center;
            gap: 14px;
        }
        .wordmark-name {
            font-size: 28px;
            font-weight: 650;
            line-height: 1;
            letter-spacing: -0.5px;
        }
        .wordmark-tag {
            color: var(--muted);
            font-family: 'Space Mono', monospace;
            font-size: 10px;
            font-weight: 500;
            line-height: 1.35;
            text-transform: uppercase;
        }
        .site-nav {
            display: flex;
            align-items: center;
            gap: 28px;
        }
        .site-nav a {
            position: relative;
            font-size: 14px;
            font-weight: 500;
        }
        .site-nav a:after {
            position: absolute;
            right: 0;
            bottom: -6px;
            left: 0;
            height: 1px;
            content: "";
            background: var(--ink);
            transform: scaleX(0);
            transform-origin: left;
            transition: transform .18s ease;
        }
        .site-nav a:hover:after { transform: scaleX(1); }

        /* Auth Container */
        .auth-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 24px;
        }
        .auth-card {
            width: 100%;
            max-width: 420px;
        }
        .auth-title {
            font-size: 32px;
            font-weight: 650;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
        }
        .auth-subtitle {
            color: var(--muted);
            font-size: 15px;
            margin-bottom: 40px;
            line-height: 1.6;
        }

        /* Form */
        .form-group {
            margin-bottom: 24px;
        }
        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--ink);
            margin-bottom: 8px;
        }
        .form-input {
            width: 100%;
            height: 48px;
            padding: 0 16px;
            border: 1px solid var(--line);
            border-radius: 8px;
            font-size: 15px;
            color: var(--ink);
            background: var(--bg);
            transition: border-color .18s ease;
            outline: none;
            font-family: inherit;
        }
        .form-input:focus {
            border-color: var(--ink);
        }
        .form-input::placeholder {
            color: var(--faint);
        }
        .password-wrapper {
            position: relative;
        }
        .password-toggle {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--faint);
            cursor: pointer;
            font-size: 14px;
            padding: 4px;
            transition: color .18s ease;
        }
        .password-toggle:hover {
            color: var(--ink);
        }

        /* Checkbox */
        .form-check {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 24px;
        }
        .form-check input[type="checkbox"] {
            width: 16px;
            height: 16px;
            accent-color: var(--ink);
            cursor: pointer;
        }
        .form-check label {
            font-size: 14px;
            color: var(--muted);
            cursor: pointer;
        }

        /* Button */
        .btn-primary {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 52px;
            border: 1px solid var(--ink);
            border-radius: 999px;
            color: #fff;
            background: var(--ink);
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: color .18s ease, background .18s ease;
            gap: 10px;
            font-family: inherit;
        }
        .btn-primary:hover {
            color: var(--ink);
            background: transparent;
        }
        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Error */
        .error-msg {
            display: none;
            padding: 14px 16px;
            border: 1px solid var(--danger);
            background: rgba(197, 48, 48, 0.06);
            color: var(--danger);
            font-size: 14px;
            border-radius: 8px;
            margin-bottom: 20px;
            line-height: 1.5;
        }
        .error-msg.show { display: block; }

        /* Links */
        .auth-link {
            text-align: center;
            margin-top: 28px;
            font-size: 14px;
            color: var(--muted);
        }
        .auth-link a {
            font-weight: 600;
            color: var(--ink);
        }
        .auth-link a:hover {
            text-decoration: underline;
        }

        /* Footer */
        .auth-footer {
            text-align: center;
            padding: 32px 24px;
        }
        .auth-footer p {
            font-family: 'Space Mono', monospace;
            font-size: 11px;
            color: var(--faint);
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .auth-footer span {
            font-weight: 700;
            color: var(--ink);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .auth-title { font-size: 26px; }
            .auth-container { padding: 24px 20px; }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="site-header">
        <a href="/" class="wordmark">
            <div>
                <div class="wordmark-name">SEO & GEO</div>
            </div>
        </a>
        <nav class="site-nav">
            <a href="/">首页</a>
            <a href="/register.html">注册</a>
        </nav>
    </header>

    <!-- Login Form -->
    <main class="auth-container">
        <div class="auth-card">
            <h1 class="auth-title">登录系统</h1>
            <p class="auth-subtitle">请输入您的凭据以继续使用审核工具。</p>

            <div id="errorMessage" class="error-msg">
                <span id="errorText"></span>
            </div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="username">用户名</label>
                    <input type="text" id="username" name="username" required autocomplete="username" class="form-input" placeholder="输入用户名">
                </div>
                <div class="form-group">
                    <label for="password">密码</label>
                    <div class="password-wrapper">
                        <input type="password" id="password" name="password" required autocomplete="current-password" class="form-input" placeholder="输入密码">
                        <button type="button" onclick="togglePassword()" class="password-toggle">
                            <i class="fas fa-eye" id="passwordToggleIcon"></i>
                        </button>
                    </div>
                </div>
                <div class="form-check">
                    <input type="checkbox" id="rememberMe" name="rememberMe">
                    <label for="rememberMe">记住我 (7天)</label>
                </div>
                <button type="submit" id="loginBtn" class="btn-primary">
                    <span>登录系统</span>
                    <i class="fas fa-arrow-right"></i>
                </button>
            </form>

            <div class="auth-link">
                还没有账号？ <a href="register.html">免费注册</a>
            </div>
        </div>
    </main>

    <!-- Footer -->

    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.js"></script>
    <script src="js/auth.js"></script>
    <script>
        function togglePassword() {
            const input = document.getElementById('password');
            const icon = document.getElementById('passwordToggleIcon');
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.replace('fa-eye', 'fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.replace('fa-eye-slash', 'fa-eye');
            }
        }

        const form = document.getElementById('loginForm');
        const loginBtn = document.getElementById('loginBtn');
        const errorMessage = document.getElementById('errorMessage');
        const errorText = document.getElementById('errorText');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const rememberMe = document.getElementById('rememberMe').checked;
            errorMessage.classList.remove('show');
            loginBtn.disabled = true;
            loginBtn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> <span>连接中...</span>';
            try {
                await login(username, password, rememberMe);
            } catch (error) {
                errorText.textContent = error.message || '登录失败';
                errorMessage.classList.add('show');
                loginBtn.disabled = false;
                loginBtn.innerHTML = '<span>登录系统</span><i class="fas fa-arrow-right"></i>';
            }
        });

        document.getElementById('username').focus();
    </script>
</body>
</html>
